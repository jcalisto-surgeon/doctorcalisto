<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Juan Luis Calisto — Second Opinion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16231F;
    --petrol:#0E403B;
    --petrol-soft:#1C5A52;
    --paper:#FBFAF6;
    --paper-2:#F3F1E8;
    --brass:#A9803F;
    --line:#E1DFD3;
    --muted:#5C6660;
    --shadow:0 1px 2px rgba(22,35,31,.04), 0 12px 40px -24px rgba(22,35,31,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  .serif{font-family:"Newsreader",Georgia,serif}
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--brass);font-weight:500;
  }
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(251,250,246,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .mark{font-family:"Newsreader",serif;font-size:19px;font-weight:500;letter-spacing:.01em}
  .mark span{color:var(--brass)}
  .lang{display:flex;gap:2px;font-family:"IBM Plex Mono",monospace;font-size:13px}
  .lang button{
    background:none;border:none;cursor:pointer;color:var(--muted);
    padding:6px 9px;border-radius:6px;font:inherit;letter-spacing:.05em;
    transition:color .2s,background .2s;
  }
  .lang button.on{color:var(--ink);background:var(--paper-2)}
  .lang button:hover{color:var(--ink)}
  .lang button:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}

  /* ---------- hero ---------- */
  .hero{padding:88px 0 64px;position:relative;overflow:hidden}
  .hero .eyebrow{margin-bottom:22px}
  .hero h1{
    font-family:"Newsreader",serif;font-weight:400;
    font-size:clamp(2.4rem,5.5vw,4rem);line-height:1.08;
    letter-spacing:-.01em;max-width:15ch;margin-bottom:26px;
  }
  .hero h1 em{font-style:italic;color:var(--petrol)}
  .hero .lede{font-size:1.18rem;max-width:52ch;color:#2E3A35;margin-bottom:40px}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn{
    display:inline-flex;align-items:center;gap:9px;
    font-family:"IBM Plex Sans",sans-serif;font-size:15px;font-weight:500;
    padding:14px 26px;border-radius:2px;border:1px solid var(--petrol);
    cursor:pointer;text-decoration:none;transition:all .2s;
  }
  .btn-solid{background:var(--petrol);color:#F7FBF9}
  .btn-solid:hover{background:var(--ink);border-color:var(--ink)}
  .btn-ghost{background:none;color:var(--petrol)}
  .btn-ghost:hover{background:var(--paper-2)}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  /* fork signature */
  .fork{position:absolute;right:-40px;top:70px;width:46%;max-width:520px;opacity:.9;pointer-events:none}
  .fork path{fill:none;stroke:var(--petrol-soft);stroke-width:1.4;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw 1.8s ease forwards}
  .fork .p2{stroke:var(--brass);animation-delay:.5s}
  .fork .node{fill:var(--paper);stroke:var(--petrol-soft);stroke-width:1.4;
    opacity:0;animation:pop .5s ease forwards}
  .fork .n-fork{animation-delay:.9s}
  .fork .n-a{animation-delay:1.5s}
  .fork .n-b{stroke:var(--brass);animation-delay:1.8s}
  .fork text{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--muted);
    opacity:0;animation:pop .6s ease forwards}
  .fork .t-a{animation-delay:1.6s}
  .fork .t-b{fill:var(--brass);animation-delay:1.95s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}

  /* ---------- section scaffold ---------- */
  section{padding:64px 0}
  .sec-head{max-width:60ch;margin-bottom:44px}
  .sec-head h2{
    font-family:"Newsreader",serif;font-weight:400;
    font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.15;
    margin:14px 0 0;letter-spacing:-.01em;
  }
  .divider{border-top:1px solid var(--line)}

  /* ---------- credentials ---------- */
  .creds{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .cred{background:var(--paper);padding:30px 30px 28px}
  .cred .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brass);letter-spacing:.1em}
  .cred h3{font-family:"Newsreader",serif;font-weight:500;font-size:1.35rem;margin:12px 0 6px;line-height:1.2}
  .cred p{font-size:.98rem;color:var(--muted)}
  .statline{display:flex;gap:40px;flex-wrap:wrap;margin-top:36px;padding-top:32px;border-top:1px solid var(--line)}
  .stat .big{font-family:"Newsreader",serif;font-size:2.6rem;line-height:1;color:var(--petrol)}
  .stat .lbl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
    letter-spacing:.06em;margin-top:8px;text-transform:uppercase}

  /* ---------- scope ---------- */
  .scope-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
  .scope-list{list-style:none;margin-top:8px}
  .scope-list li{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}
  .scope-list li:before{content:"";flex:none;width:7px;height:7px;margin-top:9px;
    border:1px solid var(--brass);border-radius:50%}
  .scope-note{background:var(--paper-2);border-left:2px solid var(--brass);
    padding:24px 26px;border-radius:0 3px 3px 0;font-size:.96rem;color:#3A443F}
  .scope-note strong{font-weight:600}

  /* ---------- process ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .step{background:var(--paper);padding:34px 28px}
  .step .num{font-family:"Newsreader",serif;font-size:2.2rem;color:var(--brass);line-height:1}
  .step h3{font-size:1.05rem;font-weight:600;margin:18px 0 8px}
  .step p{font-size:.95rem;color:var(--muted)}

  /* ---------- contact ---------- */
  .contact{background:var(--petrol);color:#EAF2EF;border-radius:4px;padding:56px 48px;
    display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .contact h2{font-family:"Newsreader",serif;font-weight:400;font-size:2.1rem;line-height:1.15;color:#fff}
  .contact p{color:#B8CCC6;margin-top:16px;font-size:1rem}
  .contact .eyebrow{color:#C89A5C}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:#9FB8B2;margin-bottom:7px}
  .field input,.field textarea{
    width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    border-radius:2px;padding:12px 14px;color:#fff;font:inherit;font-size:15px;
    transition:border .2s,background .2s;
  }
  .field input::placeholder,.field textarea::placeholder{color:#7C948E}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--brass);background:rgba(255,255,255,.1)}
  .contact .btn-solid{background:#fff;color:var(--petrol);border-color:#fff;width:100%;justify-content:center;margin-top:6px}
  .contact .btn-solid:hover{background:var(--paper-2)}
  .contact .direct{margin-top:22px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:#9FB8B2}
  .contact .direct a{color:#EAF2EF;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}

  /* ---------- footer ---------- */
  footer{padding:48px 0 60px;border-top:1px solid var(--line);margin-top:24px}
  footer .wrap{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end}
  .disclaimer{max-width:60ch;font-size:12.5px;color:var(--muted);line-height:1.55}
  .footmark{font-family:"Newsreader",serif;font-size:16px}

  @media (max-width:820px){
    .fork{display:none}
    .creds{grid-template-columns:1fr}
    .scope-grid{grid-template-columns:1fr;gap:36px}
    .steps{grid-template-columns:1fr}
    .contact{grid-template-columns:1fr;gap:36px;padding:40px 28px}
    .hero{padding:60px 0 40px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .fork path{stroke-dashoffset:0}
    .fork .node,.fork text{opacity:1}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="mark">Dr. Juan Luis Calisto<span>.</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="en" class="on" onclick="setLang('en')">EN</button>
      <button id="es" onclick="setLang('es')">ES</button>
    </div>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow" data-k="hero_ey">Pediatric Colorectal &amp; Pelvic Surgery</div>
    <h1 class="serif" data-k="hero_h"></h1>
    <p class="lede" data-k="hero_l"></p>
    <div class="hero-cta">
      <a href="#request" class="btn btn-solid" data-k="hero_c1"></a>
      <a href="#scope" class="btn btn-ghost" data-k="hero_c2"></a>
    </div>
  </div>
  <svg class="fork" viewBox="0 0 520 320" aria-hidden="true">
    <path style="--len:210" d="M20 160 H230" />
    <path class="p1" style="--len:230" d="M230 160 C300 160 320 90 470 80" />
    <path class="p2" style="--len:230" d="M230 160 C300 160 320 230 470 240" />
    <circle class="node n-fork" cx="230" cy="160" r="6"/>
    <circle class="node n-a" cx="470" cy="80" r="6"/>
    <circle class="node n-b" cx="470" cy="240" r="6"/>
    <text class="t-a" x="360" y="66" data-k="fork_a">path A</text>
    <text class="t-b" x="360" y="266" data-k="fork_b">path B</text>
  </svg>
</header>

<div class="wrap"><div class="divider"></div></div>

<section id="creds">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow" data-k="cr_ey">Credentials</div>
      <h2 data-k="cr_h"></h2>
    </div>
    <div class="creds">
      <div class="cred"><div class="n">01</div><h3 data-k="cr1_h"></h3><p data-k="cr1_p"></p></div>
      <div class="cred"><div class="n">02</div><h3 data-k="cr2_h"></h3><p data-k="cr2_p"></p></div>
      <div class="cred"><div class="n">03</div><h3 data-k="cr3_h"></h3><p data-k="cr3_p"></p></div>
      <div class="cred"><div class="n">04</div><h3 data-k="cr4_h"></h3><p data-k="cr4_p"></p></div>
    </div>
    <div class="statline">
      <div class="stat"><div class="big">3,500+</div><div class="lbl" data-k="st1"></div></div>
      <div class="stat"><div class="big">550+</div><div class="lbl" data-k="st2"></div></div>
      <div class="stat"><div class="big">2017–25</div><div class="lbl" data-k="st3"></div></div>
    </div>
  </div>
</section>

<section id="scope" style="background:var(--paper-2)">
  <div class="wrap">
    <div class="scope-grid">
      <div>
        <div class="eyebrow" data-k="sc_ey">What a second opinion covers</div>
        <h2 class="serif" data-k="sc_h" style="font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:400;line-height:1.15;margin-top:14px;margin-bottom:18px"></h2>
        <ul class="scope-list">
          <li data-k="sc_i1"></li>
          <li data-k="sc_i2"></li>
          <li data-k="sc_i3"></li>
          <li data-k="sc_i4"></li>
          <li data-k="sc_i5"></li>
        </ul>
      </div>
      <div class="scope-note" data-k="sc_note"></div>
    </div>
  </div>
</section>

<section id="process">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow" data-k="pr_ey">How it works</div>
      <h2 data-k="pr_h"></h2>
    </div>
    <div class="steps">
      <div class="step"><div class="num">1</div><h3 data-k="pr1_h"></h3><p data-k="pr1_p"></p></div>
      <div class="step"><div class="num">2</div><h3 data-k="pr2_h"></h3><p data-k="pr2_p"></p></div>
      <div class="step"><div class="num">3</div><h3 data-k="pr3_h"></h3><p data-k="pr3_p"></p></div>
    </div>
  </div>
</section>

<section id="request">
  <div class="wrap">
    <div class="contact">
      <div>
        <div class="eyebrow" data-k="rq_ey">Request a consultation</div>
        <h2 data-k="rq_h"></h2>
        <p data-k="rq_p"></p>
        <div class="direct" data-k="rq_direct"></div>
      </div>
      <div>
        <div class="field"><label data-k="f_name"></label><input type="text" id="f_name" data-kph="f_name_ph"></div>
        <div class="field"><label data-k="f_email"></label><input type="email" id="f_email" data-kph="f_email_ph"></div>
        <div class="field"><label data-k="f_msg"></label><textarea id="f_msg" rows="3" data-kph="f_msg_ph"></textarea></div>
        <button class="btn btn-solid" onclick="sendReq()" data-k="f_btn"></button>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footmark serif">Dr. Juan Luis Calisto</div>
    <div class="disclaimer" data-k="foot"></div>
  </div>
</footer>

  }
};

function setLang(l){
  document.documentElement.lang = l;
  document.getElementById('en').classList.toggle('on', l==='en');
  document.getElementById('es').classList.toggle('on', l==='es');
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v = COPY[l][el.dataset.k];
    if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-kph]').forEach(el=>{
    const v = COPY[l][el.dataset.kph];
    if(v!==undefined) el.placeholder = v;
  });
}

function sendReq(){
  const l = document.documentElement.lang;
  const name = encodeURIComponent(document.getElementById('f_name').value || '');
  const msg  = encodeURIComponent(document.getElementById('f_msg').value || '');
  const subj = l==='es' ? 'Solicitud de segunda opinión' : 'Second opinion request';
  // Placeholder address — replace with the practice inbox before going live.
  window.location.href = `mailto:consultations@example.com?subject=${subj} — ${name}&body=${msg}`;
}

setLang('en');
</script>
</body>
</html>
